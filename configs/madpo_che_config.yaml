agent_model:
  name: Qwen/Qwen2.5-Coder-3B
  type: qwen
  temperature: 0.6
  top_p: 0.6
  top_k: null
  max_length: 2048
  special_tokens: {}
  torch_dtype: bfloat16

agents: null

dataset:
  name: OpenMLRL/CoopHumanEval
  type: coophumaneval
  train_split: train[16:]
  eval_split: train[:16]

seed: 42

output:
  base_dir: output_madpo_che
  verbose: false
  save_final_model: false

external:
  mode: level_feedback
  sandbox_slice: 1
  external_prompt_passthrough: false

madpo:
  parallel_training: none
  agent_devices:
  - cuda:0
  num_agents: 2
  num_turns: 1
  agent_learning_rate: 2.0e-05
  logging_steps: 50
  max_new_tokens: 256
  rollout_buffer_size: 4
  eval_interval: 4
  eval_num_samples: 4
  eval_batch_size: 1
  beta: 0.1
  num_iterations: 1
  preference_pairs_per_item: 16
  dpo_epochs_per_iteration: 4
  use_reference_model: true

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: -4

preference:
  comparator:
    type: self
    agents: null
    provider: null
    model: null
    api_key_env: null
    base_url: null

wandb:
  project: comlrl_preference
  entity: OpenMLRL
  name: madpo_coophumaneval
  dir: output_madpo_che
  tags:
  - madpo
  - coophumaneval
  - direct-preference
  - turns_1
