agent_model:
  name: Qwen/Qwen2.5-Coder-3B
  type: qwen
  temperature: 0.6
  top_p: 0.6
  top_k: null
  max_length: 2048
  special_tokens: {}
  torch_dtype: bfloat16

agents: null

critic_model:
  name: Qwen/Qwen2.5-Coder-3B
  type: qwen
  max_length: 2048
  torch_dtype: bfloat16

critics: null

dataset:
  name: openai/openai_humaneval
  type: humaneval
  train_split: test[33:163]
  eval_split: test[:32]

seed: 42

output:
  base_dir: output_marlhf_he
  verbose: false
  save_final_model: false

external:
  mode: level_feedback
  sandbox_slice: 1
  external_prompt_passthrough: false

marlhf:
  algorithm: magrpo
  num_iterations: 1

grpo:
  parallel_training: none
  num_turns: 1
  num_train_epochs: 6
  agent_learning_rate: 2.0e-05
  logging_steps: 50
  num_generations: 4
  max_new_tokens: 256
  discount: 0.9
  joint_mode: aligned
  early_termination_threshold: -0.1
  rollout_buffer_size: 2
  train_batch_size: 2
  advantage_normalization: true
  eval_interval: 4
  eval_num_samples: 4
  eval_batch_size: 1
  reward_shift: 0

magrpo:
  parallel_training: none
  agent_devices:
  - cuda:0
  num_agents: 2
  num_turns: 1
  num_train_epochs: 6
  agent_learning_rate: 2.0e-05
  logging_steps: 50
  num_generations: 4
  max_new_tokens: 256
  discount: 0.9
  joint_mode: aligned
  early_termination_threshold: -0.2
  rollout_buffer_size: 2
  train_batch_size: 2
  advantage_normalization: true
  eval_interval: 4
  eval_num_samples: 4
  eval_batch_size: 1

maac:
  parallel_training: none
  agent_devices:
  - cuda:0
  critic_devices:
  - cuda:0
  num_agents: 2
  num_turns: 1
  critic_type: v
  num_train_epochs: 40
  agent_learning_rate: 5.0e-06
  critic_learning_rate: 5.0e-06
  value_loss_coef: 0.6
  rollout_buffer_size: 2
  train_batch_size: 2
  max_new_tokens: 256
  discount: 0.9
  early_termination_threshold: -0.2
  eval_interval: 40
  eval_num_samples: 4
  eval_batch_size: 1
  logging_steps: 10
  reward_shift: 0

iac:
  parallel_training: none
  agent_devices:
  - cuda:0
  critic_devices:
  - cuda:0
  num_agents: 2
  num_turns: 1
  use_separate_critic: true
  num_train_epochs: 40
  agent_learning_rate: 5.0e-06
  critic_learning_rate: 5.0e-06
  value_loss_coef: 0.6
  value_clip_range: 0.2
  rollout_buffer_size: 2
  train_batch_size: 2
  max_new_tokens: 256
  discount: 0.9
  early_termination_threshold: -0.2
  eval_interval: 40
  eval_num_samples: 4
  eval_batch_size: 1
  logging_steps: 10
  reward_shift: 0

reward:
  type: function

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: -4

reward_model:
  base_model: Qwen/Qwen2.5-Coder-3B
  num_train_epochs: 1
  train_batch_size: 2
  learning_rate: 1.0e-05
  max_length: 2048
  batch_size: 8
  torch_dtype: bfloat16

preference:
  num_passes: 1
  shuffle: true
  overwrite: true
  comparator:
    type: self
    agents: null
    provider: null
    model: null
    api_key_env: null
    base_url: null

wandb:
  project: comlrl_preference
  entity: OpenMLRL
  name: marlhf_he
  dir: output_marlhf_he
  tags:
  - marlhf
  - humaneval
  - iterative
