
model:
  name: "Qwen/Qwen2.5-Coder-3B"
  type: "qwen"
  temperature: 0.7
  top_p: 0.9
  max_length: 2048
  tokenizer_kwargs:
    trust_remote_code: true
  model_kwargs:
    trust_remote_code: true
    torch_dtype: "bfloat16"

dataset:
  name: "OpenMLRL/CoopHumanEval"
  type: "coophumaneval"
  train_split: "train[16:]"
  eval_split: "train[:16]"

output:
  base_dir: "output"
  save_final_model: false
  verbose: false

external:
  mode: "level_feedback"
  sandbox_slice: 1

grpo:
  num_turns: 2
  num_train_epochs: 20
  learning_rate: 2.0e-5
  logging_steps: 50
  num_generations: 4
  max_new_tokens: 256
  temperature: 0.8
  top_p: 0.95
  top_k: null
  discount: 0.9
  termination_threshold: -0.1
  rollout_buffer_size: 2
  train_batch_size: 2
  eval_interval: 4
  eval_num_samples: 4
  eval_batch_size: 1
  joint_mode: aligned
  reward_shift: -2.1

wandb:
  project: "comlrl"
  entity: "OpenMLRL"
  name: "grpo_coophumaneval"
  dir: "output"
  tags: ["grpo", "coophumaneval"]
