agent_model:
  name: "Qwen/Qwen2.5-Coder-3B"
  type: "qwen"
  temperature: 0.6
  top_p: 0.6
  top_k: null
  max_length: 2048
  torch_dtype: "bfloat16"
  special_tokens: {}

agents: null

critic_model: null

critics: null

dataset:
  name: "openai/openai_humaneval"
  type: "humaneval"
  train_split: "test[33:163]"
  eval_split: "test[:32]"

seed: 42

output:
  base_dir: output_magrpo_he
  save_final_model: false
  verbose: false

external:
  mode: "level_feedback"
  sandbox_slice: 1
  external_prompt_passthrough: false

magrpo:
  parallel_training: none
  agent_devices: ["cuda:0"]
  num_agents: 2
  num_turns: 2
  num_train_epochs: 6
  agent_learning_rate: 2.0e-5
  logging_steps: 50
  num_generations: 4
  max_new_tokens: 256
  discount: 0.9
  joint_mode: aligned
  early_termination_threshold: -0.2
  rollout_buffer_size: 2
  train_batch_size: 2
  advantage_normalization: true
  eval_interval: 4
  eval_num_samples: 4
  eval_batch_size: 1

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: -4

wandb:
  project: "comlrl"
  entity: "OpenMLRL"
  name: "magrpo_humaneval"
  dir: output_magrpo_he
  tags: ["magrpo", "humaneval", "multi-agent"]
