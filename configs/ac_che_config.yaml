agent_model:
  name: Qwen/Qwen2.5-Coder-3B
  type: qwen
  temperature: 0.6
  top_p: 0.6
  top_k: null
  max_length: 2048
  torch_dtype: bfloat16

agents: null

critic_model:
  name: Qwen/Qwen2.5-Coder-3B
  type: qwen
  max_length: 2048
  torch_dtype: bfloat16

critics: null

dataset:
  name: OpenMLRL/CoopHumanEval
  type: coophumaneval
  train_split: train[16:]
  eval_split: train[:16]

output:
  base_dir: output_ac_che
  verbose: false
  save_final_model: false
  save_path: output_ac_che

external:
  mode: level_feedback
  sandbox_slice: 1

ac:
  parallel_training: none
  num_turns: 2
  num_train_epochs: 80
  agent_learning_rate: 5.0e-06
  critic_learning_rate: 5.0e-06
  value_loss_coef: 0.6
  rollout_buffer_size: 4
  max_new_tokens: 256
  discount: 0.9
  early_termination_threshold: -0.2
  advantage_normalization: true
  eval_interval: 40
  eval_num_samples: 4
  eval_batch_size: 1
  reward_shift: -4

wandb:
  project: comlrl
  entity: OpenMLRL
  name: ac_coophumaneval
  dir: output_ac_che
  tags:
  - ac
  - coophumaneval
  - single-agent
  - turns_2
