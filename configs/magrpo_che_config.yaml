agent_model:
  name: Qwen/Qwen2.5-Coder-3B
  type: qwen
  temperature: 0.6
  top_p: 0.6
  top_k: null
  max_length: 2048
  special_tokens: {}
  torch_dtype: bfloat16

agents: null

critic_model: null

critics: null

dataset:
  name: OpenMLRL/CoopHumanEval
  type: coophumaneval
  train_split: train[16:]
  eval_split: train[:16]

seed: 42

output:
  base_dir: output_magrpo_che
  verbose: false
  save_final_model: false

external:
  mode: level_feedback
  sandbox_slice: 1
  external_prompt_passthrough: false

magrpo:
  parallel_training: none
  agent_devices:
  - cuda:0
  num_agents: 2
  num_turns: 2
  num_train_epochs: 8
  agent_learning_rate: 2.0e-05
  logging_steps: 50
  num_generations: 4
  max_new_tokens: 256
  discount: 0.9
  joint_mode: aligned
  early_termination_threshold: -0.2
  rollout_buffer_size: 4
  train_batch_size: 4
  advantage_normalization: true
  eval_interval: 4
  eval_num_samples: 4
  eval_batch_size: 1

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: -4

wandb:
  project: comlrl
  entity: OpenMLRL
  name: magrpo_coophumaneval
  dir: output_magrpo_che
  tags:
  - magrpo
  - coophumaneval
  - multi-agent
  - turns_2
