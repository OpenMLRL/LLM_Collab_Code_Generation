agent_model:
  name: "Qwen/Qwen2.5-Coder-3B"
  type: "qwen"
  temperature: 0.7
  top_p: 0.9
  max_length: 2048
  torch_dtype: "bfloat16"

agents: null

critic_model:
  name: "Qwen/Qwen2.5-Coder-3B"
  type: "qwen"
  temperature: 0.7
  top_p: 0.9
  max_length: 2048
  torch_dtype: "bfloat16"

critics: null

dataset:
  name: "openai/openai_humaneval"
  type: "humaneval"
  train_split: "test[33:163]"
  eval_split: "test[:32]"

output:
  base_dir: "output"
  verbose: false
  save_final_model: false
  save_path: "output/maac_final"

external:
  mode: "level_feedback"
  sandbox_slice: 1

maac:
  parallel_training: auto
  num_agents: 2
  num_turns: 2
  critic_type: "v"
  num_train_epochs: 80
  agent_learning_rate: 5.0e-6
  critic_learning_rate: 5.0e-6
  value_loss_coef: 0.6
  rollout_buffer_size: 4
  train_batch_size: 4
  max_new_tokens: 256
  temperature: 0.6
  top_p: 0.6
  top_k: null
  discount: 0.9
  early_termination_threshold: -0.2
  eval_interval: 40
  eval_num_samples: 4
  eval_batch_size: 1
  logging_steps: 10
  reward_shift: -4

wandb:
  project: "comlrl"
  entity: "OpenMLRL"
  name: "maac_humaneval"
  dir: "output"
  tags: ["maac", "humaneval", "multi-agent", "turns_2"]
